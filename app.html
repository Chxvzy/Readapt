<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Readapt - App</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo-readapt-white.png">

    <!-- Carregamento direto do Google Fonts via HTML -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Nunito:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilo CSS principal -->
    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <!-- Container principal da SPA -->
    <main class="app-container">

        <!-- ==========================================
             1. TELA DE CARREGAMENTO (LOADING)
             ========================================== -->
        <section id="screen-loading" class="screen active">
            <div class="brand-box">
                <img src="assets/readapt-logo.png" alt="Logo Readapt" class="brand-logo">
                <div class="logo-text">
                    <p>Read<strong>apt</strong></p>
                </div>
            </div>
        </section>

        <!-- ==========================================
             2. TELA DE BOAS-VINDAS (WELCOME)
             ========================================== -->
        <section id="screen-welcome" class="screen">
            <!-- Imagem de Fundo Decorativa -->
            <img src="assets/background-img-welcome.png" alt="" class="welcome-bg">

            <div class="welcome-container">
                <!-- Ilustração do Mascote -->
                <div class="welcome-illustration">
                    <img src="assets/welcome-robo.png" alt="Mascote Readapt" class="mascot-img">
                </div>

                <!-- Textos e Título -->
                <div class="welcome-content">
                    <h2>Descubra uma nova forma de aprender</h2>
                    <p>
                        Explore ferramentas inteligentes criadas para 
                        transformar leitura, escrita e aprendizagem 
                        em experiências mais acessíveis e divertidas
                    </p>
                </div>

                <!-- Botões de Ação -->
                <div class="welcome-actions">
                    <button class="btn-app-solid">Login</button>
                    <button class="btn-app-outline">Cadastrar</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Script de Navegação entre Telas -->
    <script src="js/app.js"></script>
</body>
</html>
